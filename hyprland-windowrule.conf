# ME6Blocker — Hyprland window rules
# Source this from your hyprland.conf or windowrules.conf:
#
#   source = /path/to/ME6Blocker/hyprland-windowrule.conf
#
# The app_id "ME6Blocker" is set by the application itself via
# QApplication::setApplicationName before the QApplication is constructed.

windowrule {
    name  = float
    match:class = ^ME6Blocker$
}

windowrule {
    name  = size 360 800
    match:class = ^ME6Blocker$
}

windowrule {
    name  = center
    match:class = ^ME6Blocker$
}

windowrule {
    name  = stayfocused
    match:class = ^ME6Blocker$
}
