# ME6Blocker — Hyprland window rules
# Source this from your hyprland.conf or windowrules.conf:
#
#   source = ~/.local/share/ME6Blocker/hyprland-windowrule.conf

# Match by class / app_id (native Wayland and X11)
windowrule = match:class ^(ME6Blocker)$, float on, size 360 800, center on

# Match by title (ensures floating even when running via sudo/python where class defaults to python3)
windowrule = match:title ^(ME6Blocker)$, float on, size 360 800, center on


